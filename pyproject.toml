[build-system]
requires = ["setuptools>=61", "wheel<0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "py4siesta"
version = "1.0.0"
description = "Utilities and CLI helpers for preparing SIESTA calculations"
readme = "README.MD"
requires-python = ">=3.7"
dependencies = [
  "matplotlib",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
agent = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.7,<3",
]
openai = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.7,<3",
  "langchain-openai>=1.0,<2",
]
anthropic = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.7,<3",
  "langchain-anthropic>=1.0,<2",
]
ollama = [
  "langchain>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "pydantic>=2.7,<3",
  "langchain-ollama>=1.0,<2",
]
materials-project = ["mp-api>=0.45"]

[project.scripts]
py4siesta = "py4siesta.cli:main"
py4siesta-tool = "py4siesta.tool_cli:main"
py4siesta-agent = "py4siesta_agent.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["py4siesta", "py4siesta_agent*", "NanoCore"]
